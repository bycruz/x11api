name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lde-org/lde@master

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils

      - name: Run tests
        run: xvfb-run lde test
